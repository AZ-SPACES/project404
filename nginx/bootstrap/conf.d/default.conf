# HTTP-only nginx, used ONLY while issuing the first Let's Encrypt certificate.
#
# The real config (nginx/conf.d) has a `listen 443` block whose ssl_certificate paths
# do not exist yet on a fresh machine, so nginx would refuse to start and the ACME
# HTTP-01 challenge could never be answered. scripts/init-api-ssl.sh swaps this tree in
# via docker-compose.ssl-bootstrap.yml for the duration of the challenge, then swaps back.
#
# This is a separate mount — nothing here overwrites the real config.

server {
    listen 80;
    server_name api.aza.systems;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503 "Issuing SSL certificate — this config is only live during bootstrap.\n";
    }
}
