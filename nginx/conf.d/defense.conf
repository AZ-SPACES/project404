# CS project defense scoring — defense.aza.systems
#
# No new DNS record and no new certificate were needed for this host:
#
#   DNS   — *.aza.systems already points at this droplet (proxied), the same
#           record the mini apps ride on. "defense" is one label deep, so it
#           is covered.
#   Cert  — the wildcard *.aza.systems issued by scripts/init-miniapps-ssl.sh
#           covers it too, which is why this file reuses that certificate
#           rather than adding another certbot flow. It must therefore stay
#           issued: if that wildcard is ever revoked, this vhost stops nginx
#           from starting and takes api.aza.systems down with it.
#
# No collision with miniapps.conf: its regexes require the hostname to end in
# "-mini" or "-mini-preview", and an exact server_name wins over a regex match
# regardless of file order.
#
# NOTE: this application has no authentication whatsoever. Anyone who can
# reach this hostname can file or overwrite a ballot for any of the 501
# students, and can replace the roster via /import. That is a deliberate,
# explicit choice for the defense window — not an oversight. Take the vhost
# down (delete this file and reload nginx) once results are exported.

server {
    listen 80;
    server_name defense.aza.systems;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name defense.aza.systems;

    ssl_certificate     /etc/letsencrypt/live/aza.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aza.systems/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # The import wizard posts a .xlsx or .csv allocation sheet. nginx's default
    # cap is 1M, which would reject those as 413 before Next ever saw them.
    client_max_body_size 25M;

    location / {
        # Deliberately NOT `proxy_pass http://defense-evaluations:3000`.
        #
        # nginx resolves a literal upstream hostname once, at config load, and
        # refuses to start if it does not resolve. With the whole API on this
        # same nginx, a defense container that failed to build would take
        # api.aza.systems down with it. Routing through a variable defers the
        # lookup to request time against Docker's embedded DNS, so a broken or
        # absent evaluations container is a 502 on this hostname alone.
        resolver 127.0.0.11 valid=10s;
        set $defense_upstream defense-evaluations:3000;

        # $request_uri is required, not decorative: once proxy_pass contains a
        # variable, nginx stops passing the original URI implicitly and sends
        # only what the directive spells out. Without it every request would
        # arrive at Next as "/". It carries the query string, which is what
        # ?format=csv&room=rm-3 on the export links depends on.
        proxy_pass         http://$defense_upstream$request_uri;

        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}
