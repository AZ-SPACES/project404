# Aza-hosted mini app bundles — one origin per app.
#
#   bolt-ghana-mini.aza.systems          → /srv/miniapps/bolt-ghana/current  (live)
#   bolt-ghana-mini-preview.aza.systems  → /srv/miniapps/bolt-ghana/preview  (in review)
#
# The per-app hostname is the entire point. Serving every mini app from paths on one host
# would put them all in one browser origin, letting any mini app read every other one's
# localStorage, IndexedDB, cookies and service workers. Third-party code shares an origin
# with nobody.
#
# Why "-mini" rather than <app>.miniapps.aza.systems
# --------------------------------------------------
# Cloudflare's Universal SSL covers aza.systems and *.aza.systems — one label deep only.
# A two-level host would need Advanced Certificate Manager (paid) or a grey-clouded record
# pointing straight at the origin, and this droplet's firewall admits Cloudflare ranges
# only. Keeping mini apps one label deep means the existing proxied *.aza.systems record
# and its certificate already cover them: no new DNS, no new cost, firewall untouched.
#
# Nothing else in the zone ends in "-mini", so an app id can never collide with api, admin,
# pay, merchants, turn, www or superagents.
#
# `current` and `preview` are symlinks that MiniAppBundleService swaps atomically, so
# publishing and rolling back never rewrite a file nginx is reading.
#
# Traffic arrives proxied through Cloudflare, so the certificate below only has to satisfy
# the Cloudflare→origin leg (SSL mode Full/Full-strict). See scripts/init-miniapps-ssl.sh.

# Cloudflare normally upgrades to HTTPS at the edge, but a plain-HTTP request that reaches
# the origin must not fall through to whichever port-80 block nginx happens to load first.
server {
    listen 80;
    server_name ~^[a-z0-9][a-z0-9-]*-mini(-preview)?\.aza\.systems$;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Preview host, matched FIRST — the live-app regex below would otherwise swallow any app
# whose hostname ends in "-mini-preview".
server {
    listen 443 ssl;
    server_name ~^(?<app>[a-z0-9][a-z0-9-]*)-mini-preview\.aza\.systems$;

    ssl_certificate     /etc/letsencrypt/live/aza.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aza.systems/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # $app comes from the Host header, and is interpolated into a filesystem path. The
    # regex is what makes that safe: no dots, no slashes, so "../" can never appear here.
    root /srv/miniapps/$app/preview;
    index index.html;

    # An unapproved bundle must never be indexed or cached anywhere.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 = @no_bundle;
    location @no_bundle {
        default_type text/plain;
        return 404 "No bundle is currently staged for this mini app.";
    }
}

# Live host.
server {
    listen 443 ssl;
    server_name ~^(?<app>[a-z0-9][a-z0-9-]*)-mini\.aza\.systems$;

    ssl_certificate     /etc/letsencrypt/live/aza.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aza.systems/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /srv/miniapps/$app/current;
    index index.html;

    # NOTE ON THE REPETITION BELOW — it is load-bearing, not sloppiness.
    # nginx's add_header does NOT merge across levels: a location block that declares any
    # add_header of its own inherits *none* from the server block. So every location that
    # sets a caching header must restate the security headers, or those responses ship
    # without them. Dropping nosniff on .js in particular is a live MIME-confusion risk.
    # Mini apps run in Aza's WebView and never in a frame, so denying framing outright
    # removes clickjacking of a payment UI as a category at no legitimate cost.
    # Deliberately no Access-Control-Allow-Origin anywhere: nothing should be fetching a
    # mini app's assets cross-origin, and that isolation is why these hostnames exist.

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Hashed build assets are immutable; a new deploy produces new filenames.
    location ~* \.(js|css|woff2?|png|jpe?g|gif|svg|webp|avif|ico|ttf|eot)$ {
        try_files $uri =404;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # index.html is not content-hashed, so it must be revalidated every load — otherwise a
    # user stays pinned to a bundle version that has already been replaced or rolled back.
    location = /index.html {
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback: Expo Router and React Router serve every route from index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 = @not_published;
    location @not_published {
        default_type text/plain;
        return 404 "This mini app is not currently published.";
    }
}
