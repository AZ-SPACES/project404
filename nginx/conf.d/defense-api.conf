# CS project defense scoring, API origin — defense-api.aza.systems
#
# The UI for this app is on Vercel (defense.aza.systems); the database is not,
# and cannot be: defense-db publishes no port and lives only on aza-network, so
# that Vercel could never reach it. This vhost is the seam between the two — the
# droplet keeps the data and serves it over HTTP, Vercel serves the pages.
#
#   DNS   — none needed. *.aza.systems already points at this droplet, and
#           unlike "defense" (now an explicit CNAME to Vercel) this host is
#           left to ride that wildcard.
#   Cert  — the wildcard *.aza.systems from scripts/init-miniapps-ssl.sh covers
#           it: "defense-api" is one label deep, same as "defense" was.
#
# No collision with miniapps.conf: its regexes require the hostname to end in
# "-mini" or "-mini-preview", and an exact server_name wins over a regex match
# regardless of file order.
#
# NOTE: this application has no authentication whatsoever. Anyone who can reach
# this hostname can file or overwrite a ballot for any of the 501 students, and
# can replace the roster via /api/import/commit. That is a deliberate, explicit
# choice for the defense window — not an oversight. The CORS allowlist in
# evaluations/proxy.ts is not a substitute: it constrains other people's
# browsers, not curl. Take this vhost down (delete this file and reload nginx)
# once results are exported.

server {
    listen 80;
    server_name defense-api.aza.systems;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name defense-api.aza.systems;

    ssl_certificate     /etc/letsencrypt/live/aza.systems/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aza.systems/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=63072000" always;

    # The import wizard posts a .xlsx or .csv allocation sheet, and it posts it
    # straight here rather than through Vercel — which is the point: nginx caps
    # this at 25M, whereas a Vercel function would reject the same upload at a
    # far lower request-body limit. nginx's own default of 1M would 413 it
    # before Next ever saw it.
    client_max_body_size 25M;

    location / {
        # Deliberately NOT `proxy_pass http://defense-evaluations:3000`.
        #
        # nginx resolves a literal upstream hostname once, at config load, and
        # refuses to start if it does not resolve. With the whole API on this
        # same nginx, a defense container that failed to build would take
        # api.aza.systems down with it. Routing through a variable defers the
        # lookup to request time against Docker's embedded DNS, so a broken or
        # absent evaluations container is a 502 on this hostname alone.
        resolver 127.0.0.11 valid=10s;
        set $defense_upstream defense-evaluations:3000;

        # $request_uri is required, not decorative: once proxy_pass contains a
        # variable, nginx stops passing the original URI implicitly and sends
        # only what the directive spells out. Without it every request would
        # arrive at Next as "/". It carries the query string, which is what
        # ?format=csv&room=rm-3 on the export links depends on.
        proxy_pass         http://$defense_upstream$request_uri;

        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # CORS is answered by the app (evaluations/proxy.ts), not here, so the
        # preflight needs the Origin to survive the hop.
        proxy_set_header   Origin $http_origin;
        proxy_http_version 1.1;
    }
}
