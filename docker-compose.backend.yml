# Production overlay for the DigitalOcean droplet, where the aza frontends are on Vercel
# and the box serves api.aza.systems and defense.aza.systems. It disables the six aza-*
# Next.js services; nginx needs no override, because nginx/conf.d is the served config
# (HTTP + HTTPS) in its final state.
#
# Command: docker compose -f docker-compose.yml -f docker-compose.backend.yml up -d
# The deploy workflow always passes both files.

services:
  # Served by Vercel — see DNS for aza.systems and admin/merchants/pay/superagents/pitch.aza.systems.
  # Nothing in nginx/conf.d routes to these, so running them on the droplet only burns build time.
  aza-web:
    profiles: ["disabled"]

  aza-admin:
    profiles: ["disabled"]

  aza-merchants:
    profiles: ["disabled"]

  aza-pay:
    profiles: ["disabled"]

  aza-superagents:
    profiles: ["disabled"]

  aza-pitch:
    profiles: ["disabled"]

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  # DELIBERATELY NOT DISABLED: `evaluations` and `defense-db` are absent from the
  # list above because, unlike the aza-* frontends, the defense scoring app is not
  # on Vercel. It is a stateful Next.js app that talks to a Postgres on the private
  # compose network, so this droplet is what serves it — see nginx/conf.d/defense.conf.
  # Adding it to the disabled profiles would 502 defense.aza.systems.
