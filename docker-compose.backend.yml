# Production overlay for the DigitalOcean droplet, where the aza frontends are on Vercel
# and the box serves api.aza.systems and defense-api.aza.systems. It disables the six aza-*
# Next.js services; nginx needs no override, because nginx/conf.d is the served config
# (HTTP + HTTPS) in its final state.
#
# Command: docker compose -f docker-compose.yml -f docker-compose.backend.yml up -d
# The deploy workflow always passes both files.

services:
  # Served by Vercel — see DNS for aza.systems and admin/merchants/pay/superagents/pitch.aza.systems.
  # Nothing in nginx/conf.d routes to these, so running them on the droplet only burns build time.
  aza-web:
    profiles: ["disabled"]

  aza-admin:
    profiles: ["disabled"]

  aza-merchants:
    profiles: ["disabled"]

  aza-pay:
    profiles: ["disabled"]

  aza-superagents:
    profiles: ["disabled"]

  aza-pitch:
    profiles: ["disabled"]

  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  # DELIBERATELY NOT DISABLED: `evaluations` and `defense-db` are absent from the
  # list above. The defense scoring UI *is* on Vercel now, like the aza-* frontends,
  # but only the UI moved — the roster and every recorded ballot live in defense-db,
  # which publishes no port and sits on the private compose network where Vercel
  # cannot reach it. So `evaluations` stays up here as the API origin Vercel calls,
  # over defense-api.aza.systems — see nginx/conf.d/defense-api.conf.
  #
  # Adding either to the disabled profiles would leave defense.aza.systems loading
  # and permanently empty: the pages would render on Vercel and every data call
  # behind them would fail.
