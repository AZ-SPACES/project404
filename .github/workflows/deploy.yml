name: Deploy

on:
  # Auto-deploy only after CI passes on main
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

  # Allow triggering a deploy manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    # For workflow_run triggers: only deploy if CI actually passed
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # The droplet serves api.aza.systems only — every frontend is on Vercel, so the
            # overlay disables the four Next.js services. nginx/conf.d is the API config in
            # its final state, HTTPS included, so a plain `docker compose up` is still
            # correct here; the overlay only trims what gets built.
            COMPOSE="docker compose -f docker-compose.yml -f docker-compose.backend.yml"

            echo "→ Pulling latest code..."
            git pull origin main

            echo "→ Rebuilding and restarting services..."
            SENTRY_RELEASE=$(git rev-parse --short HEAD) \
            $COMPOSE up --build -d --remove-orphans

            # Blindly sleeping asserted nothing about the backend: the old gate accepted
            # health=n/a, and now that the container has a healthcheck it would accept
            # health=starting just as happily. Wait for the probe to actually pass, so a
            # backend that boots and then wedges — or dies on a failed migration — fails
            # the deploy here instead of being discovered by a user.
            echo "→ Waiting for backend to report healthy..."
            BACKEND_CID=$($COMPOSE ps -q backend)
            if [ -z "$BACKEND_CID" ]; then
              echo "  ✗ backend has no container after up"
              exit 1
            fi
            DEADLINE=$(( $(date +%s) + 180 ))
            while :; do
              B_STATE=$(docker inspect -f '{{.State.Status}}' "$BACKEND_CID" 2>/dev/null || echo unknown)
              B_HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}}' "$BACKEND_CID" 2>/dev/null || echo unknown)
              if [ "$B_HEALTH" = "healthy" ]; then
                echo "  backend healthy"
                break
              fi
              if [ "$B_STATE" != "running" ]; then
                echo "  ✗ backend is $B_STATE before becoming healthy"
                $COMPOSE logs --tail=60 backend 2>&1 || true
                exit 1
              fi
              if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                echo "  ✗ backend never became healthy (state=$B_STATE health=$B_HEALTH)"
                $COMPOSE logs --tail=60 backend 2>&1 || true
                exit 1
              fi
              sleep 5
            done

            echo "→ Current containers:"
            $COMPOSE ps

            # `docker compose ps` exits 0 whether a container is up, dead, or restarting
            # in a loop, so printing it asserted nothing: a service that died on a bad
            # config deployed "successfully" and went unnoticed until someone looked.
            #
            # Only the compose services this box actually serves. The Next.js apps are on
            # Vercel and disabled by the overlay, but `ps` still lists containers left
            # running from an older deploy — asserting on those would fail the deploy over
            # a service that is meant to be down.
            #
            # coturn is deliberately absent: TURN runs as a host service on the droplet,
            # not under compose (see the disabled coturn service in docker-compose.yml).
            # Docker cannot see it, so requiring it here would fail every deploy. It is
            # reachable externally and worth checking that way if TURN monitoring is wanted.
            REQUIRED="postgres redis backend nginx"
            FAILED=""

            restart_counts() {
              for svc in $REQUIRED; do
                cid=$($COMPOSE ps -q "$svc" 2>/dev/null || true)
                if [ -n "$cid" ]; then
                  printf '%s=%s ' "$svc" "$(docker inspect -f '{{.RestartCount}}' "$cid" 2>/dev/null || echo ?)"
                fi
              done
              return 0
            }

            report_states() {
              for svc in $REQUIRED; do
                cid=$($COMPOSE ps -q "$svc" 2>/dev/null || true)
                if [ -z "$cid" ]; then
                  echo "  ✗ $svc — no container"
                  FAILED="$FAILED $svc"
                  continue
                fi
                state=$(docker inspect -f '{{.State.Status}}' "$cid" 2>/dev/null || echo unknown)
                health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}n/a{{end}}' "$cid" 2>/dev/null || echo unknown)
                if [ "$state" != "running" ] || [ "$health" = "unhealthy" ]; then
                  echo "  ✗ $svc — state=$state health=$health"
                  FAILED="$FAILED $svc"
                else
                  echo "  ✓ $svc — state=$state health=$health"
                fi
              done
              return 0
            }

            echo "→ Verifying required services are running..."
            BEFORE=$(restart_counts)
            report_states

            # A crash-looping container reads as "running" the instant after it restarts,
            # so state alone cannot tell a healthy service from one dying every few
            # seconds. Compare Docker's restart counters across a window instead.
            sleep 15
            AFTER=$(restart_counts)
            if [ "$BEFORE" != "$AFTER" ]; then
              echo "  ✗ a service restarted during the settle window — crash loop"
              echo "      before: $BEFORE"
              echo "      after:  $AFTER"
              FAILED="$FAILED crash-loop"
            fi
            report_states

            if [ -n "$FAILED" ]; then
              # report_states runs twice, so a service down in both passes lists twice.
              FAILED=$(echo "$FAILED" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')
              echo "✗ Deploy failed — not healthy: $FAILED"
              $COMPOSE logs --tail=60 $REQUIRED 2>&1 || true
              exit 1
            fi
            echo "  all required services running"

            echo "→ Verifying nginx is serving HTTPS..."
            $COMPOSE exec -T nginx nginx -t
            $COMPOSE exec -T nginx grep -q "listen 443" /etc/nginx/conf.d/default.conf

            echo "→ Pruning unused images..."
            docker image prune -f

            echo "✓ Deploy complete."
