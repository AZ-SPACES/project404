name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend unit tests ────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (Java 21)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Runners have a Docker daemon, so the Testcontainers *IT classes actually execute
      # here — the full Flyway chain against a real PostgreSQL 16, plus the concurrent
      # -transfer experiment. On a laptop without Docker they skip instead of failing.
      - name: Run tests (unit + Testcontainers integration)
        run: |
          mvn test --no-transfer-progress \
            -Dsurefire.excludes="**/*ApplicationTests.java"
        working-directory: backend

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: backend/target/site/jacoco/
          retention-days: 7

  # ── Backend Docker build (compile + image validation) ─────────────────────
  backend-docker:
    name: Backend Docker Build
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: aza-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Mobile app: typecheck + unit tests (incl. the E2EE crypto suite) ──────
  # Added because nothing in CI previously ran the mobile app at all — which meant the
  # cryptographic test suite (x3dh, e2ee, keystore, mediaCrypto, backupCrypto) that the
  # platform's confidentiality claims rest on was never exercised by an automated gate.
  mobile-test:
    name: Mobile Tests (Expo / RN)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # Install from the workspace root: npm hoists @react-native/jest-preset there while
      # react-native stays nested in aza/node_modules. Installing inside aza/ alone leaves
      # the preset unresolvable and jest dies at config load.
      - name: Install workspace dependencies
        run: npm install

      # tsconfig.ci.json is tsconfig.json with the @miniapps/* aliases pointed at a stub
      # declaration. The mini apps are sibling workspaces with no node_modules of their
      # own, so pulling their sources into this program yields two dozen spurious
      # "Cannot find module 'react'" errors. See aza/types/miniapp-workspaces.d.ts.
      - name: Typecheck
        run: npx tsc -p tsconfig.ci.json --noEmit
        working-directory: aza

      - name: Unit tests with coverage
        run: npm test -- --coverage --ci
        working-directory: aza

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-coverage
          path: aza/coverage/
          retention-days: 7

  # ── Frontend lint + build (all 5 Next.js apps in parallel) ───────────────
  frontend-ci:
    name: Frontend CI (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: aza-web
            NEXT_PUBLIC_API_URL: https://api.aza.systems
            NEXT_PUBLIC_SITE_URL: https://aza.systems
          - app: aza-admin
            NEXT_PUBLIC_API_URL: https://api.aza.systems
          - app: aza-merchants
            NEXT_PUBLIC_API_URL: https://api.aza.systems
          - app: aza-pay
            NEXT_PUBLIC_API_URL: https://api.aza.systems
          - app: aza-superagents
            NEXT_PUBLIC_API_URL: https://api.aza.systems

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: ${{ matrix.app }}

      - name: Lint
        run: npm run lint
        working-directory: ${{ matrix.app }}
        env:
          NEXT_PUBLIC_API_URL: ${{ matrix.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ matrix.NEXT_PUBLIC_SITE_URL }}

      - name: Build
        run: npm run build
        working-directory: ${{ matrix.app }}
        env:
          NEXT_PUBLIC_API_URL: ${{ matrix.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ matrix.NEXT_PUBLIC_SITE_URL }}
          NEXT_TELEMETRY_DISABLED: 1
