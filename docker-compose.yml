services:
  postgres:
    image: postgres:16
    container_name: aza-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-aza_db}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - aza-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-aza_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aza-redis
    restart: unless-stopped
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-server --requirepass $$REDIS_PASSWORD; else redis-server; fi"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - aza-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TURN relay for WebRTC calls. Without it a call connects only when the two
  # peers can reach each other directly, which fails behind the symmetric NAT
  # most mobile carriers use: the call rings, reports itself connected, then
  # sits silent. CallService hands clients turn:<TURN_HOST>:3478 (udp + tcp)
  # and turns:<TURN_HOST>:5349, authenticated by an HMAC of TURN_SECRET, so
  # static-auth-secret in turnserver.conf must equal TURN_SECRET exactly.
  #
  # host networking rather than bridge: coturn allocates relay ports across
  # 49152-65535 and publishing ~16k ports through docker-proxy is impractical.
  # The container binds the host's interfaces directly, so the droplet firewall
  # must allow 3478/udp, 3478/tcp, 5349/tcp and 49152-65535/udp, and
  # `external-ip` in turnserver.conf must be the droplet's public address.
  coturn:
    # DISABLED — the droplet already runs coturn as a host service, and this
    # container cannot coexist with it. Both want :3478 with host networking, so
    # the container lost the race and restarted 201 times before the deploy
    # health check caught it ("bind: Address in use" in its logs).
    #
    # The host instance is verified working: it answers STUN, challenges with
    # realm turn.aza.systems, and allocates relays against the same TURN_SECRET
    # the backend signs with. Nothing is lost by leaving it in charge.
    #
    # This definition is kept, not deleted, because it is the migration target:
    # to move TURN into compose, stop and disable the host service first
    # (`systemctl disable --now coturn`), then drop this profile. Until then
    # turnserver.conf.example documents what the host instance must contain.
    profiles: ["disabled"]
    image: coturn/coturn:4.6-alpine
    container_name: aza-coturn
    restart: unless-stopped
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      # Gitignored: it carries static-auth-secret. Copy turnserver.conf.example
      # and fill it in — that file documents every value.
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      # TURNS on 5349 needs a certificate for TURN_HOST. No cert is issued for
      # it yet (init-api-ssl.sh covers api.aza.systems only), so until one is,
      # coturn logs the missing file and serves plain TURN on 3478.
      - certbot_certs:/etc/letsencrypt:ro

  backend:
    build: ./backend
    container_name: aza-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-aza_db}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      ARKESEL_API_KEY: ${ARKESEL_API_KEY}
      ARKESEL_SENDER_ID: ${ARKESEL_SENDER_ID}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-noreply@aza.systems}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      TURN_SECRET: ${TURN_SECRET}
      TURN_HOST: ${TURN_HOST:-turn.aza.systems}
      APP_BASE_URL: https://aza.systems
      APP_API_BASE_URL: https://api.aza.systems
      # Single-instance deploy: skip the Redis hop for real-time delivery.
      # Set to "false" if you ever scale aza-backend beyond one instance.
      WEBSOCKET_LOCAL_DELIVERY: "true"
      ALLOWED_ORIGINS: https://aza.systems,https://www.aza.systems,https://admin.aza.systems,https://merchants.aza.systems,https://pay.aza.systems,https://superagents.aza.systems
      TRUSTED_PROXY_IPS: 172.16.0.0/12,127.0.0.1,::1
      SWAGGER_ENABLED: true
      HCAPTCHA_SECRET: ${HCAPTCHA_SECRET:-}
      CHALLENGE_HMAC_SECRET: ${CHALLENGE_HMAC_SECRET}
      PAYMENT_PROOF_HMAC_SECRET: ${PAYMENT_PROOF_HMAC_SECRET}
      PASSKIT_API_KEY: ${PASSKIT_API_KEY:-}
      PASSKIT_API_SECRET: ${PASSKIT_API_SECRET:-}
      PASSKIT_TEMPLATE_ID: ${PASSKIT_TEMPLATE_ID:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      FIREBASE_CREDENTIALS_PATH: /etc/aza/firebase-service-account.json
      MINIAPP_BUNDLE_ROOT: /srv/miniapps
      MINIAPP_HOST_SUFFIX: ${MINIAPP_HOST_SUFFIX:-aza.systems}
      MINIAPP_LABEL_SUFFIX: ${MINIAPP_LABEL_SUFFIX:-mini}
    volumes:
      - ./backend/src/main/resources/firebase-service-account.json:/etc/aza/firebase-service-account.json:ro
      # Extracted mini app bundles. The backend writes here on upload and approval; nginx
      # mounts the same volume read-only to serve them.
      - miniapp_bundles:/srv/miniapps
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Without this the deploy gate could only assert the container was running, which a
    # process that booted and then wedged still satisfies. /actuator/health aggregates the
    # datasource and Redis, so "healthy" means the app is actually able to serve, not just
    # that the JVM is alive. The JRE image is Alpine and has no curl; busybox wget is there.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 3
      # Flyway runs every pending migration before the port opens, so the first probe must
      # not start counting failures until the app has had time to boot.
      start_period: 120s
    networks:
      - aza-network

  aza-web:
    build:
      context: ./aza-web
      args:
        NEXT_PUBLIC_API_URL: https://api.aza.systems
    container_name: aza-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - aza-network

  aza-admin:
    build:
      context: ./aza-admin
      args:
        NEXT_PUBLIC_API_URL: https://api.aza.systems
    container_name: aza-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - aza-network

  aza-merchants:
    build:
      context: ./aza-merchants
      args:
        NEXT_PUBLIC_API_URL: https://api.aza.systems
    container_name: aza-merchants
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - aza-network

  aza-pay:
    build:
      context: ./aza-pay
      args:
        NEXT_PUBLIC_API_URL: https://api.aza.systems
    container_name: aza-pay
    restart: unless-stopped
    environment:
      NODE_ENV: production
    networks:
      - aza-network

  aza-superagents:
    build:
      context: ./aza-superagents
      args:
        NEXT_PUBLIC_API_URL: https://api.aza.systems
    container_name: aza-superagents
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Server-side only: the portal's proxy routes reach the API over the compose network,
      # so no browser traffic depends on this and it never has to be a public hostname.
      BACKEND_URL: http://aza-backend:8080
    networks:
      - aza-network

  nginx:
    image: nginx:alpine
    container_name: aza-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      # Read-only: nginx serves mini app bundles but must never be able to modify them.
      - miniapp_bundles:/srv/miniapps:ro
    depends_on:
      - backend
    networks:
      - aza-network

  certbot:
    # dns-cloudflare rather than plain certbot: it is a superset (the webroot plugin used by
    # api.aza.systems is still there) and adds the DNS-01 plugin that the wildcard cert for
    # *.miniapps.aza.systems needs. `certbot renew` replays whichever method each certificate
    # was issued with, so on the plain image the wildcard would silently fail to renew and
    # every mini app would go dark ~90 days after launch.
    image: certbot/dns-cloudflare
    container_name: aza-certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
      # Must persist for renewal, not just issuance — DNS-01 re-authenticates every time.
      # Created by scripts/init-miniapps-ssl.sh; gitignored because it holds a live token.
      - ./secrets:/etc/aza-secrets:ro
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done'"
    restart: unless-stopped

networks:
  aza-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  certbot_webroot:
  certbot_certs:
  miniapp_bundles:
