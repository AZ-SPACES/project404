# Integration profile: a real PostgreSQL 16 supplied by Testcontainers, with the real
# Flyway migration chain. The datasource URL is injected at runtime by
# @ServiceConnection, so it is deliberately absent here.
#
# This is the opposite of application-test.properties in the one way that matters:
# there, Hibernate builds the schema from the entities on H2 and Flyway is switched off.
# That arrangement cannot catch a broken migration, a stale CHECK constraint, or a
# missing column default — the exact defects behind V50, V51 and V57 — and H2 cannot
# exercise SELECT ... FOR UPDATE row locking at all.
spring.flyway.enabled=true

# No baselining here. A container starts empty, so the full V1 -> V57 chain must run
# and succeed on its own merits. Baselining would silently skip the very migrations
# this suite exists to verify.
spring.flyway.baseline-on-migrate=false

# The production setting. Hibernate validates the entity mappings against whatever
# Flyway produced and never alters it, so an entity/migration mismatch fails the build.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.open-in-view=false

# Redis — the real host and port come from the Testcontainers Redis in
# PostgresIntegrationTest via @ServiceConnection, which overrides these at connection
# time. They must still be set: application.properties declares
# spring.data.redis.port=${REDIS_PORT} with no default, and CI runs `mvn test` with no
# .env, so without an override here the literal placeholder reaches the binder and
# fails with NumberFormatException before any connection detail is consulted.
#
# A reachable instance is genuinely required, not just a bindable port:
# RedisMessageListenerContainer opens a connection as the context starts, and unlike the
# unit-test profile nothing mocks it here.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Secrets: test-only values, same as the unit profile.
app.jwt.secret=test-jwt-secret-key-that-is-at-least-64-characters-long-for-testing-only
app.totp.encryption-key=dGVzdC10b3RwLWtleS1tdXN0LWJlLTMyLWJ5dGVzISE=
cloudinary.cloud-name=test
cloudinary.api-key=test
cloudinary.api-secret=test
arkesel.api-key=test
arkesel.sender-id=test
app.security.challenge.hmac-secret=test-hmac-secret
app.waitlist.internal-secret=test-waitlist-secret
turn.secret=test-turn-secret
app.payment-proof.hmac-secret=test-payment-proof-secret
